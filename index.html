<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WebRTC P2P 螢幕直播間 (終極版)</title>
    <!-- 引入 PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        input, button {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        input { flex: 1; min-width: 200px; }
        button {
            background: #0284c7;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        button.stop { background: #dc2626; }
        button.stop:hover { background: #b91c1c; }
        video {
            width: 100%;
            max-height: 450px;
            background: #000;
            border-radius: 8px;
            object-fit: contain;
        }
        #status {
            font-weight: bold;
            color: #fbbf24;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>🎥 P2P 瀏覽器螢幕直播 (終極版)</h2>

    <div class="card">
        <div class="control-group">
            <label for="roomInput">頻道名稱：</label>
            <input type="text" id="roomInput" placeholder="例如：my-live-room-999">
        </div>
        <div class="control-group">
            <button id="startBroadcastBtn" onclick="startBroadcast()">📡 開始直播 (分享螢幕)</button>
            <button id="joinBtn" onclick="joinBroadcast()">👁️ 加入接收直播</button>
            <button id="stopBtn" class="stop" onclick="stopAll()" style="display:none;">❌ 離開/停止</button>
        </div>
        <div id="status">狀態：尚未連線</div>
    </div>

    <div class="card">
        <h3>畫面預覽 / 播放區</h3>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <script>
        let peer = null;
        let currentStream = null;
        let activeCall = null;

        const statusEl = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');
        const startBtn = document.getElementById('startBroadcastBtn');
        const joinBtn = document.getElementById('joinBtn');
        const stopBtn = document.getElementById('stopBtn');
        const roomInput = document.getElementById('roomInput');

        // 包含 STUN 與公開免費 TURN 伺服器的設定（突破各種防火牆限制）
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { 
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    { 
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            }
        };

        function setStatus(text) {
            statusEl.innerText = `狀態：${text}`;
        }

        async function startBroadcast() {
            const roomName = roomInput.value.trim();
            if (!roomName) {
                alert('請先輸入頻道名稱！');
                return;
            }

            try {
                currentStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                remoteVideo.srcObject = currentStream;
                remoteVideo.muted = true;

                const myPeerId = `p2p-live-v2-${roomName}-host`;
                peer = new Peer(myPeerId, peerConfig);

                peer.on('open', (id) => {
                    setStatus(`直播中！頻道：${roomName} (等待觀眾連入...)`);
                    toggleButtons(true);
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        alert('此頻道名稱已經有人在使用了，請換一個名字！');
                    } else {
                        alert(`連線錯誤: ${err.type}`);
                    }
                    stopAll();
                });

                peer.on('call', (call) => {
                    setStatus(`有觀眾連入，正在建立視訊通道...`);
                    call.answer(currentStream);
                    
                    call.on('close', () => {
                        setStatus(`直播中！有觀眾離開了`);
                    });
                });

                currentStream.getVideoTracks()[0].onended = () => {
                    stopAll();
                };

            } catch (err) {
                console.error(err);
                alert('無法取得螢幕畫面或權限被拒絕。');
            }
        }

        function joinBroadcast() {
            const roomName = roomInput.value.trim();
            if (!roomName) {
                alert('請先輸入頻道名稱！');
                return;
            }

            setStatus('正在初始化連線...');
            peer = new Peer(peerConfig);

            peer.on('open', () => {
                const broadcasterPeerId = `p2p-live-v2-${roomName}-host`;
                setStatus(`正在連接頻道 [${roomName}]...`);

                const emptyStream = new MediaStream();
                const call = peer.call(broadcasterPeerId, emptyStream);
                activeCall = call;

                call.on('stream', (remoteStream) => {
                    setStatus(`成功接收直播畫面！`);
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.muted = false;
                    toggleButtons(true);
                });

                call.on('close', () => {
                    setStatus('直播已結束或主播已斷線。');
                    stopAll();
                });

                call.on('error', (err) => {
                    alert('連線失敗，找不到該頻道的直播主。');
                    stopAll();
                });
            });

            peer.on('error', (err) => {
                alert(`連線錯誤: ${err.type}`);
                stopAll();
            });
        }

        function stopAll() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (activeCall) {
                activeCall.close();
                activeCall = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            remoteVideo.srcObject = null;
            setStatus('已離線');
            toggleButtons(false);
        }

        function toggleButtons(isLive) {
            startBtn.style.display = isLive ? 'none' : 'inline-block';
            joinBtn.style.display = isLive ? 'none' : 'inline-block';
            stopBtn.style.display = isLive ? 'inline-block' : 'none';
            roomInput.disabled = isLive;
        }
    </script>
</body>
</html>
