<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>純 P2P 螢幕直播間 (強制直連版)</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        input, button {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        input { flex: 1; min-width: 200px; }
        button {
            background: #0284c7;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        button.stop { background: #dc2626; }
        button.stop:hover { background: #b91c1c; }
        video {
            width: 100%;
            max-height: 450px;
            background: #000;
            border-radius: 8px;
            object-fit: contain;
        }
        #status {
            font-weight: bold;
            color: #fbbf24;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>🔥 純 P2P 瀏覽器螢幕直播</h2>

    <div class="card">
        <div class="control-group">
            <label for="roomInput">頻道名稱：</label>
            <input type="text" id="roomInput" placeholder="例如：p2p-room-123">
        </div>
        <div class="control-group">
            <button id="startBroadcastBtn" onclick="startBroadcast()">📡 開始直播 (P2P 主播)</button>
            <button id="joinBtn" onclick="joinBroadcast()">👁️ 加入接收 (P2P 觀眾)</button>
            <button id="stopBtn" class="stop" onclick="stopAll()" style="display:none;">❌ 離線</button>
        </div>
        <div id="status">狀態：尚未連線</div>
    </div>

    <div class="card">
        <h3>P2P 影音接收區</h3>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <script>
        let peer = null;
        let currentStream = null;
        let activeCall = null;

        const statusEl = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');
        const startBtn = document.getElementById('startBroadcastBtn');
        const joinBtn = document.getElementById('joinBtn');
        const stopBtn = document.getElementById('stopBtn');
        const roomInput = document.getElementById('roomInput');

        // 多重 STUN 伺服器設定，確保網路打洞成功率最高
        const p2pConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun.cloudflare.com:3478' }
                ],
                iceTransportPolicy: 'all' // 允許所有候選者進行 P2P 連線
            }
        };

        function setStatus(text) {
            statusEl.innerText = `狀態：${text}`;
        }

        async function startBroadcast() {
            const roomName = roomInput.value.trim();
            if (!roomName) { alert('請輸入頻道名稱！'); return; }

            try {
                // 擷取螢幕
                currentStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always", frameRate: 30 },
                    audio: true
                });

                remoteVideo.srcObject = currentStream;
                remoteVideo.muted = true;

                const myPeerId = `p2p-pure-${roomName}-host`;
                peer = new Peer(myPeerId, p2pConfig);

                peer.on('open', () => {
                    setStatus(`P2P 主播就緒！頻道：${roomName} (等待接收端呼叫...)`);
                    toggleButtons(true);
                });

                peer.on('error', (err) => {
                    alert(`PeerJS 錯誤: ${err.type}`);
                    stopAll();
                });

                // 當觀眾連入並要求打通 P2P 視訊通道時
                peer.on('call', (call) => {
                    setStatus(`偵測到觀眾連入，正在建立 P2P 直連通道...`);
                    
                    // 回傳我們的螢幕串流給觀眾
                    call.answer(currentStream);

                    call.on('stream', (remoteStream) => {
                        console.log("P2P 雙向通道已建立");
                    });

                    call.on('close', () => {
                        setStatus(`P2P 頻道：有觀眾斷開連線`);
                    });
                });

                currentStream.getVideoTracks()[0].onended = () => { stopAll(); };

            } catch (err) {
                console.error(err);
                alert('無法擷取螢幕或權限被拒。');
            }
        }

        function joinBroadcast() {
            const roomName = roomInput.value.trim();
            if (!roomName) { alert('請輸入頻道名稱！'); return; }

            setStatus('初始化 P2P 接收端...');
            peer = new Peer(p2pConfig);

            peer.on('open', () => {
                const hostId = `p2p-pure-${roomName}-host`;
                setStatus(`正在尋找並對接 P2P 主播 [${roomName}]...`);

                // 傳送一個空的 MediaStream（因為觀眾只需要接收，不需要上傳螢幕）
                const emptyStream = new MediaStream();
                const call = peer.call(hostId, emptyStream, {
                    sdpTransform: function (sdp) { return sdp; }
                });
                activeCall = call;

                // 核心：當成功收到主播的 P2P 串流時
                call.on('stream', (remoteStream) => {
                    setStatus(`🎉 P2P 直連成功！正在播放畫面`);
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.muted = false;
                    toggleButtons(true);
                });

                call.on('close', () => {
                    setStatus('P2P 直播已結束。');
                    stopAll();
                });

                call.on('error', (err) => {
                    alert('P2P 連線失敗，找不到該頻道的的主播。');
                    stopAll();
                });
            });

            peer.on('error', (err) => {
                alert(`連線錯誤: ${err.type}`);
                stopAll();
            });
        }

        function stopAll() {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            if (activeCall) {
                activeCall.close();
                activeCall = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            remoteVideo.srcObject = null;
            setStatus('已離線');
            toggleButtons(false);
        }

        function toggleButtons(isLive) {
            startBtn.style.display = isLive ? 'none' : 'inline-block';
            joinBtn.style.display = isLive ? 'none' : 'inline-block';
            stopBtn.style.display = isLive ? 'inline-block' : 'none';
            roomInput.disabled = isLive;
        }
    </script>
</body>
</html>
