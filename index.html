<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRX OS - Next-Gen Launch Event</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #fff;
        }

        /* 畫布與背景 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 全局光暈效果 */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(0, 100, 255, 0.05) 50%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 2;
            transition: all 1.5s ease;
        }

        /* UI 層級 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            padding: 40px;
        }

        /* 頂部極簡導覽列 */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 1s ease;
        }

        header.active {
            opacity: 0.8;
            transform: translateY(0);
        }

        .brand-logo {
            font-weight: 800;
            letter-spacing: 4px;
            font-size: 14px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .event-status {
            font-size: 12px;
            letter-spacing: 2px;
            color: #8899a6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3366;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* 中央 5秒 倒數計時層 */
        .countdown-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            transition: opacity 1s ease, transform 1s ease;
        }

        .countdown-number {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            font-family: monospace;
        }

        .countdown-container.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.5);
            pointer-events: none;
        }

        /* 主標題：FRX OS */
        .main-title-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            text-align: center;
            opacity: 0;
            z-index: 15;
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(20px);
        }

        .main-title-container.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            filter: blur(0px);
        }

        .glow-text {
            font-size: 110px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #e6ffff;
            text-shadow: 
                0 0 10px #00f0ff,
                0 0 20px #00f0ff,
                0 0 40px #00f0ff,
                0 0 80px #0088ff,
                0 0 120px #0088ff;
            font-family: 'Arial Rounded MT Bold', sans-serif;
        }

        /* 浮動 3D HUD 介面卡片 */
        .hud-panel {
            position: absolute;
            background: rgba(10, 25, 50, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.1);
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .hud-left {
            left: 8%;
            top: 35%;
            width: 260px;
            transform: translateX(-50px) rotateY(15deg);
        }

        .hud-right {
            right: 8%;
            top: 35%;
            width: 260px;
            transform: translateX(50px) rotateY(-15deg);
        }

        .hud-panel.show {
            opacity: 1;
            transform: translateX(0) rotateY(0deg);
        }

        .hud-line {
            height: 4px;
            background: linear-gradient(90deg, #00f0ff, transparent);
            margin-bottom: 12px;
            border-radius: 2px;
        }

        .hud-graphic {
            width: 100%;
            height: 60px;
            border-left: 2px solid #00f0ff;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .hud-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.2), transparent);
            animation: wave-move 2s infinite linear;
        }

        @keyframes wave-move {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }

        /* 底部進度與章節指示器 */
        footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        footer.active {
            opacity: 1;
        }

        .progress-bar-bg {
            width: 100%;
            max-width: 600px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0088ff, #00f0ff);
            box-shadow: 0 0 10px #00f0ff;
            transition: width 0.1s linear;
        }

        .time-display {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(0, 240, 255, 0.7);
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- 粒子與 3D 視覺畫布 -->
    <div id="canvas-container">
        <canvas id="stage"></canvas>
    </div>

    <!-- 背景光影 -->
    <div class="ambient-glow" id="glow"></div>

    <!-- UI 覆蓋層 -->
    <div class="ui-layer">
        <header id="header">
            <div class="brand-logo">FRX ARCHITECTURE</div>
            <div class="event-status">
                <div class="live-dot"></div>
                <span>GLOBAL LAUNCH EVENT</span>
            </div>
        </header>

        <!-- 5秒 倒數 -->
        <div class="countdown-container" id="countdown-box">
            <div class="countdown-number" id="countdown">5</div>
        </div>

        <!-- 核心主角：FRX OS 標題 -->
        <div class="main-title-container" id="main-title">
            <div class="glow-text">FRX OS</div>
        </div>

        <!-- 全息 HUD 卡片 1 (展示中段出現) -->
        <div class="hud-panel hud-left" id="hud-1">
            <div class="hud-line"></div>
            <div class="hud-graphic">
                <div class="hud-wave"></div>
            </div>
        </div>

        <!-- 全息 HUD 卡片 2 (展示中段出現) -->
        <div class="hud-panel hud-right" id="hud-2">
            <div class="hud-line" style="background: linear-gradient(270deg, #00f0ff, transparent);"></div>
            <div class="hud-graphic" style="border-right: 2px solid #00f0ff; border-left: none;">
                <div class="hud-wave"></div>
            </div>
        </div>

        <!-- 底部進度條 -->
        <footer id="footer">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="time-display" id="time-text">00:00 / 03:00</div>
        </footer>
    </div>

    <script>
        // --- 畫布與 Particle 引擎初始化 ---
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 粒子陣列
        const particleCount = 180;
        const particles = [];

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 1.5;
                this.y = (Math.random() - 0.5) * height * 1.5;
                this.z = Math.random() * 1000;
                this.size = Math.random() * 2 + 1;
                this.color = Math.random() > 0.3 ? '#00f0ff' : '#0077ff';
                this.baseSpeed = Math.random() * 1 + 0.5;
            }

            update(speedMultiplier) {
                this.z -= this.baseSpeed * speedMultiplier;
                if (this.z <= 0) {
                    this.reset();
                    this.z = 1000;
                }
            }

            draw(mode) {
                // 3D 透視投影
                const k = 400 / this.z;
                const px = this.x * k + width / 2;
                const py = this.y * k + height / 2;

                if (px < 0 || px > width || py < 0 || py > height) return;

                const alpha = Math.min(1, (1000 - this.z) / 800);
                
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;

                if (mode === 'hyper') {
                    // 超頻光速線條效果
                    const prevK = 400 / (this.z + 40);
                    const ppx = this.x * prevK + width / 2;
                    const ppy = this.y * prevK + height / 2;
                    
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size * k * 0.8;
                    ctx.moveTo(px, py);
                    ctx.lineTo(ppx, ppy);
                    ctx.stroke();
                } else {
                    // 一般球狀粒子
                    ctx.arc(px, py, this.size * k * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // --- 發表會時間軸控制 (總長 180 秒) ---
        const TOTAL_TIME = 180; // 3分鐘
        let elapsedTime = 0;
        let isLaunched = false;
        let speedMultiplier = 1;
        let particleRenderMode = 'normal';

        // DOM 元素
        const countdownEl = document.getElementById('countdown');
        const countdownBox = document.getElementById('countdown-box');
        const mainTitle = document.getElementById('main-title');
        const header = document.getElementById('header');
        const footer = document.getElementById('footer');
        const hud1 = document.getElementById('hud-1');
        const hud2 = document.getElementById('hud-2');
        const progressFill = document.getElementById('progress-fill');
        const timeText = document.getElementById('time-text');
        const glow = document.getElementById('glow');

        // 前 5 秒自動倒數
        let countdownVal = 5;
        const countdownTimer = setInterval(() => {
            countdownVal--;
            if (countdownVal > 0) {
                countdownEl.innerText = countdownVal;
            } else {
                clearInterval(countdownTimer);
                launchEvent(); // 5秒到了，開啟正式展示！
            }
        }, 1000);

        // 正式發表震撼登場
        function launchEvent() {
            isLaunched = true;
            countdownBox.classList.add('hidden');
            
            // 觸發衝擊波/超頻速度
            speedMultiplier = 25;
            
            setTimeout(() => {
                mainTitle.classList.add('show');
                header.classList.add('active');
                footer.classList.add('active');
                speedMultiplier = 1.5;
            }, 800);
        }

        // --- 核心動力渲染迴圈 (Render Loop) ---
        let lastTimestamp = performance.now();

        function animate(now) {
            const delta = (now - lastTimestamp) / 1000;
            lastTimestamp = now;

            if (isLaunched && elapsedTime < TOTAL_TIME) {
                elapsedTime += delta;
                updateTimeline(elapsedTime);
            }

            // 清空畫布
            ctx.fillStyle = 'rgba(3, 7, 18, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // 繪製微弱底層網格 (Grid)
            drawGrid();

            // 更新與繪製粒子
            particles.forEach(p => {
                p.update(speedMultiplier);
                p.draw(particleRenderMode);
            });

            requestAnimationFrame(animate);
        }

        // 3D 空間網格
        let gridOffset = 0;
        function drawGrid() {
            gridOffset += speedMultiplier * 0.5;
            if (gridOffset > 40) gridOffset = 0;

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
            ctx.lineWidth = 1;

            const horizon = height * 0.5;

            // 輻射縱線
            for (let x = -width; x < width * 2; x += 80) {
                ctx.beginPath();
                ctx.moveTo(width / 2, horizon);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            // 透視橫條
            for (let y = horizon; y < height; y += 15) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        // --- 3分鐘內容腳本動態控制器 ---
        function updateTimeline(t) {
            // UI 進度條更新
            const progress = (t / TOTAL_TIME) * 100;
            progressFill.style.width = `${progress}%`;

            const mins = Math.floor(t / 60).toString().padStart(2, '0');
            const secs = Math.floor(t % 60).toString().padStart(2, '0');
            timeText.innerText = `${mins}:${secs} / 03:00`;

            // === 階段 1：0:05 - 1:00 (核心亮相與脈動) ===
            if (t > 5 && t < 60) {
                const pulse = Math.sin(t * 3) * 0.1 + 1;
                mainTitle.style.transform = `translate(-50%, -50%) scale(${pulse})`;
                speedMultiplier = 1 + Math.sin(t) * 0.5;
            }

            // === 階段 2：1:00 - 2:00 (全息介面 HUD 展現) ===
            if (t >= 60 && t < 120) {
                hud1.classList.add('show');
                hud2.classList.add('show');

                // 標題微微縮小，讓出空間給 HUD
                mainTitle.style.transform = `translate(-50%, -50%) scale(0.85)`;

                // 背景光暈色調微調
                glow.style.background = `radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(0, 150, 255, 0.1) 50%, rgba(0,0,0,0) 70%)`;
            }

            // === 階段 3：2:00 - 2:45 (超頻穿梭/高潮展示) ===
            if (t >= 120 && t < 165) {
                particleRenderMode = 'hyper';
                speedMultiplier = 12; // 粒子極速流動

                // 標題呈現高能震顫感
                const shakeX = (Math.random() - 0.5) * 4;
                const shakeY = (Math.random() - 0.5) * 4;
                mainTitle.style.transform = `translate(calc(-50% + ${shakeX}px), calc(-50% + ${shakeY}px)) scale(1.1)`;
            }

            // === 階段 4：2:45 - 3:00 (完美收尾與品牌沉澱) ===
            if (t >= 165) {
                particleRenderMode = 'normal';
                speedMultiplier = 0.5; // 速度歸於平緩高雅

                hud1.classList.remove('show');
                hud2.classList.remove('show');

                mainTitle.style.transform = `translate(-50%, -50%) scale(1)`;
                glow.style.background = `radial-gradient(circle, rgba(0, 240, 255, 0.3) 0%, rgba(0, 240, 255, 0.05) 60%, rgba(0,0,0,0) 80%)`;
            }
        }

        // 啟動渲染 Loop
        requestAnimationFrame(animate);
    </script>
</body>
</html>
