<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Live - 跨裝置 P2P 傳輸中心</title>
    <!-- 引入 PeerJS 雲端信令庫 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-deep: #020617;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --liquid-surface: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }

        .liquid-glass {
            background: var(--liquid-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        header { width: 100%; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; max-width: 900px; }
        .logo-area { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { width: 40px; height: 40px; background: var(--accent-gradient); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .logo-text h1 { font-size: 1.2rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text span { font-size: 0.75rem; color: var(--text-muted); }

        .status-badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; display: flex; align-items: center; gap: 0.4rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); color: #34d399; }
        .status-dot { width: 6px; height: 6px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

        .workspace { flex: 1; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; gap: 1.5rem; }
        
        .connect-box { display: flex; gap: 0.5rem; width: 100%; max-width: 400px; }
        .connect-box input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 0.75rem 1rem; color: white; outline: none; }
        .connect-box button { background: var(--accent); border: none; border-radius: 12px; padding: 0 1.25rem; color: white; font-weight: 600; cursor: pointer; }

        .radar-container { width: 300px; height: 300px; position: relative; display: flex; align-items: center; justify-content: center; }
        .my-node { width: 75px; height: 75px; border-radius: 50%; background: var(--liquid-surface); border: 2px solid var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
        .my-node b { font-size: 0.8rem; }
        .my-node span { font-size: 0.6rem; color: var(--text-muted); }

        .drop-zone { width: 100%; max-width: 450px; padding: 2rem; text-align: center; cursor: pointer; border: 2px dashed rgba(255,255,255,0.12); border-radius: 20px; }
        .drop-zone:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.05); }

        footer { padding: 1rem; font-size: 0.7rem; color: var(--text-muted); }
        #file-input { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">FR</div>
            <div class="logo-text">
                <h1>FR Live</h1>
                <span>True Cross-Device P2P</span>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="connection-status">連線伺服器中...</span>
        </div>
    </header>

    <div class="workspace">
        <!-- 跨裝置配對輸入框 -->
        <div class="connect-box">
            <input type="text" id="targetPeerId" placeholder="輸入對方顯示的代號進行對接">
            <button onclick="connectToPeer()">對接</button>
        </div>

        <div class="radar-container">
            <div class="my-node">
                <b>我的代號</b>
                <span id="myIdDisplay" style="font-size:0.5rem; word-break: break-all; padding:0 5px;">生成中</span>
            </div>
        </div>

        <div class="liquid-card drop-zone" id="dropZone">
            <h3>點擊或拖曳檔案至此發送</h3>
            <p id="transferStateText">尚未建立 P2P 通道</p>
            <input type="file" id="file-input">
        </div>
    </div>

    <footer>FR Live Cloud P2P Engine &bull; Powered by WebRTC & PeerJS</footer>

    <script>
        // 初始化 PeerJS，自動連線至免費公共信令雲端
        const peer = new Peer();
        let conn = null;

        peer.on('open', (id) => {
            document.getElementById('myIdDisplay').textContent = id;
            document.getElementById('connection-status').textContent = '已就緒，可跨裝置連線';
        });

        // 監聽來自其他裝置的連線請求
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupConnection();
            alert(`收到來自 ${conn.peer} 的連線請求！`);
        });

        // 手動輸入對方的 ID 進行連線
        function connectToPeer() {
            const id = document.getElementById('targetPeerId').value.trim();
            if (!id) return;
            
            conn = peer.connect(id);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('connection-status').textContent = `已成功對接：${conn.peer}`;
                document.getElementById('transferStateText').textContent = `通道已建立，隨時可傳檔案`;
            });

            conn.on('data', (data) => {
                if (data.fileBuffer) {
                    // 收到檔案時自動轉為 Blob 並下載
                    const blob = new Blob([data.fileBuffer]);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.fileName;
                    a.click();
                    alert(`成功接收檔案：${data.fileName}`);
                }
            });
        }

        // 檔案傳輸邏輯
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('file-input');

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => sendFile(e.target.files[0]);

        function sendFile(file) {
            if (!conn || conn.open === false) {
                alert('請先在上方輸入對方的代號並完成對接！');
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                conn.send({
                    fileBuffer: event.target.result,
                    fileName: file.name
                });
                alert(`檔案 ${file.name} 已透過 P2P 成功傳送！`);
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
