<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Live - 點對點極速隔空傳輸</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(45deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 1px;
        }

        header p {
            color: #8b949e;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .main-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2rem 0;
        }

        .radar-circle {
            position: absolute;
            border: 1px dashed rgba(88, 166, 255, 0.2);
            border-radius: 50%;
            animation: pulse 3s infinite linear;
        }

        .c1 { width: 100px; height: 100px; animation-delay: 0s; }
        .c2 { width: 200px; height: 200px; animation-delay: 1s; }
        .c3 { width: 300px; height: 300px; animation-delay: 2s; }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .my-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #238636, #2ea043);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.4);
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .my-avatar:hover {
            transform: scale(1.05);
        }

        .peer-node {
            position: absolute;
            width: 55px;
            height: 55px;
            background: #1f6feb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(31, 111, 235, 0.5);
            animation: float 4s ease-in-out infinite;
            z-index: 5;
            transition: transform 0.2s, background-color 0.2s;
        }

        .peer-node:hover {
            background: #388bfd;
            transform: scale(1.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .drop-zone {
            width: 90%;
            max-width: 450px;
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            background: #161b22;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            cursor: pointer;
        }

        .drop-zone.dragover {
            border-color: #58a6ff;
            background: #1f242c;
        }

        .drop-zone p {
            color: #8b949e;
            font-size: 0.9rem;
        }

        .drop-zone span {
            color: #58a6ff;
            font-weight: 500;
        }

        footer {
            padding: 1rem;
            color: #484f58;
            font-size: 0.8rem;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>FR Live</h1>
        <p>安全、快速、免安裝的點對點檔案傳輸</p>
    </header>

    <div class="main-container">
        <div class="radar-circle c1"></div>
        <div class="radar-circle c2"></div>
        <div class="radar-circle c3"></div>
        
        <!-- 中央自身節點 -->
        <div class="my-avatar" title="點擊修改名稱">我</div>

        <!-- 模擬雷達掃描到的周遭裝置 -->
        <div class="peer-node" style="top: 20px; left: 50px;" onclick="selectDevice('MacBook Pro')">Mac</div>
        <div class="peer-node" style="bottom: 30px; right: 40px;" onclick="selectDevice('iPhone 15')">iPhone</div>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('file-input').click()">
        <p>點擊或將檔案拖曳至此處，傳送給鄰近裝置</p>
        <span>支援任意格式與大小</span>
        <input type="file" id="file-input" multiple>
    </div>

    <footer>
        FR Live P2P Engine v1.0 &bull; Secure WebRTC Connected
    </footer>

    <script>
        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                alert(`已選擇 ${files.length} 個檔案，請先點擊雷達上的目標裝置建立連線！`);
            }
        }

        function selectDevice(deviceName) {
            alert(`正在嘗試與 [${deviceName}] 建立 P2P 連線通道...`);
        }
    </script>
</body>
</html>
